[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kodekloud-mcp"
version = "0.1.0"
description = "A Model Context Protocol (MCP) server for KodeKloud learners to connect their progress, labs, and study plans to AI assistants."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "KodeKloud Community Contributor" }
]
keywords = [
    "mcp",
    "model-context-protocol",
    "kodekloud",
    "claude",
    "chatgpt",
    "cursor",
    "llm",
    "ai-agent",
    "learning",
    "kubernetes",
    "devops"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0"
]

[project.scripts]
kodekloud-mcp = "kodekloud_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/kodekloud-community/kodekloud-mcp"
Documentation = "https://github.com/kodekloud-community/kodekloud-mcp#readme"
Issues = "https://github.com/kodekloud-community/kodekloud-mcp/issues"
Repository = "https://github.com/kodekloud-community/kodekloud-mcp"

[tool.hatch.build.targets.wheel]
packages = ["src/kodekloud_mcp"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line length handled by formatter
]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["mcp.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning"
]

