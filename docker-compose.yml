version: "3.8"

services:
  kodekloud-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: kodekloud-mcp:latest
    container_name: kodekloud-mcp
    restart: unless-stopped
    ports:
      # Expose for remote SSE transport (e.g. ChatGPT connectors or remote MCP agents)
      - "8000:8000"
    environment:
      - KODEKLOUD_SESSION_COOKIE=${KODEKLOUD_SESSION_COOKIE:-}
      - KODEKLOUD_USE_MOCK=${KODEKLOUD_USE_MOCK:-true}
      - KODEKLOUD_ENABLE_WRITE_TOOLS=${KODEKLOUD_ENABLE_WRITE_TOOLS:-false}
      - KODEKLOUD_CACHE_TTL_SECONDS=${KODEKLOUD_CACHE_TTL_SECONDS:-60}
      - KODEKLOUD_MCP_TRANSPORT=sse
      - KODEKLOUD_MCP_HOST=0.0.0.0
      - KODEKLOUD_MCP_PORT=8000
      - KODEKLOUD_LOG_LEVEL=INFO
    command: ["--transport", "sse", "--host", "0.0.0.0", "--port", "8000"]
    # Drop all capabilities and enforce security limits
    cap_drop:
      - ALL
    read_only: false
    security_opt:
      - no-new-privileges:true
